    <!-- Scripts QuillJS -->
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script>
        // Initialiser QuillJS
        var quill = new Quill('#editor', {
            theme: 'snow'
        });

        // Mettre à jour le champ caché avec le contenu de Quill avant la soumission du formulaire
        document.querySelector('form').onsubmit = function() {
            var description = document.querySelector('#description');
            description.value = quill.root.innerHTML;
        };
        
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const files = Array.from(e.target.files);
            const preview = document.getElementById('filePreview');
            preview.innerHTML = '';
            
            if (files.length > 0) {
                files.forEach((file, index) => {
                    // Déterminer l'icône selon le type de fichier
                    let iconClass;
                    const fileType = file.type;
                    const fileName = file.name;
                    
                    if (fileType.includes('image')) {
                        iconClass = 'fas fa-image';
                    } else if (fileType.includes('pdf')) {
                        iconClass = 'fas fa-file-pdf';
                    } else if (fileType.includes('text')) {
                        iconClass = 'fas fa-file-alt';
                    } else if (fileType.includes('video')) {
                        iconClass = 'fas fa-file-video';
                    } else if (fileType.includes('audio')) {
                        iconClass = 'fas fa-file-audio';
                    } else {
                        iconClass = 'fas fa-file';
                    }
                    
                    // Créer l'élément de prévisualisation
                    const fileItem = document.createElement('div');
                    fileItem.className = 'file-item';
                    fileItem.innerHTML = `
                        <i class="${iconClass} fa-lg"></i>
                        <span>${fileName}</span>
                        <i class="fas fa-times remove-btn" data-index="${index}"></i>
                    `;
                    
                    preview.appendChild(fileItem);
                });
        
                // Gestion de la suppression
                preview.querySelectorAll('.remove-btn').forEach(button => {
                    button.addEventListener('click', function() {
                        const index = this.getAttribute('data-index');
                        files.splice(index, 1);
                        
                        // Mettre à jour l'input file
                        const newFileList = new DataTransfer();
                        files.forEach(file => newFileList.items.add(file));
                        document.getElementById('fileInput').files = newFileList.files;
                        
                        // Rafraîchir l'affichage
                        this.closest('.file-item').remove();
                        if (files.length === 0) {
                            preview.innerHTML = '';
                        }
                    });
                });
            }
        });
        </script>
