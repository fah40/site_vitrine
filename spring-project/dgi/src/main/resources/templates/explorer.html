
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Explorateur de fichiers</title>
</head>
<body>
    <h1>Explorateur de fichiers</h1>
    <p>Chemin actuel : <span th:text="${currentPath}"></span></p>
    <p th:utext="${descri}"></p>


    <!-- Afficher les erreurs -->
    <div th:if="${error}" style="color: red;">
        <p th:text="${error}"></p>
    </div>

    <!-- Liste des fichiers et dossiers -->
    <!-- Section des dossiers -->
    <h3>Dossiers</h3>
    <ul>
        <li th:each="folder : ${mapFolders.keySet()}">
            <th:block th:if="${mapFolders.get(folder) == null}">
                <a th:href="@{/admin/explorer(path=${currentPath + '/' + folder})}" th:text="${folder}"></a>
            </th:block>
            
            <th:block th:if="${mapFolders.get(folder) != null}">
                <!-- Utilisez le lien de l'objet GeneralInfo -->
                <a th:attr="href=${mapFolders.get(folder).lien}" rel="noopener noreferrer" th:text="${folder}"></a>
            </th:block>

        </li>
    </ul>

    <!-- Section des fichiers -->
    <h3>Fichiers</h3>
    <ul>
        <li th:each="file : ${mapFiles.keySet()}">
            <th:block th:if="${mapFiles.get(file) == null}">
                <a th:href="@{/admin/explorer(path=${currentPath + '/' + file})}" th:text="${file}"></a>
            </th:block>
        </li>
    </ul>

    <!-- Formulaire pour créer un dossier -->
    <h2>Créer un dossier</h2>
    <form th:action="@{/admin/create-folder}" method="post">
        <input type="hidden" name="path" th:value="${currentPath}">
        <input type="text" name="folderName" placeholder="Nom du dossier" required>
        <input type="text" name="lien">
        <button type="submit">Créer un dossier</button>
    </form>

    <!-- Formulaire pour supprimer un fichier/dossier -->
    <h2>Supprimer un fichier/dossier</h2>
    <form th:action="@{/admin/delete}" method="post">
        <input type="hidden" name="path" th:value="${currentPath}">
        <select name="fileName">
            <option th:each="file : ${files}" th:value="${file}" th:text="${file}"></option>
        </select>
        <button type="submit">Supprimer</button>
    </form>

    <!-- Formulaire pour uploader un fichier -->
    <h2>Uploader un fichier</h2>
    <form th:action="@{/admin/upload}" method="post" enctype="multipart/form-data">
        <input type="hidden" name="path" th:value="${currentPath}">
        <input type="file" name="file" required>
        <button type="submit">Envoyer</button>
    </form>
</body>
</html>
