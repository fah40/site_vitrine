<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accueil</title>
</head>
<body>
    <h2>Bienvenue sur votre espace</h2>
    <p>Connexion réussie !</p>

    <!-- Sélection de la langue -->
    <label for="langue">Choisir une langue :</label>
    <select id="langue" onchange="window.location.href='accueil?langue=' + this.value">
        <option th:each="langue : ${langues}" 
                th:value="${langue.id}"
                th:selected="${langue.id == langueSelectionnee}"
                th:text="${langue.nom}">
        </option>
    </select>

    <!-- Affichage des sections de l'accueil -->
    <section>
        <h3 th:text="${a_propos?.titre}"></h3>
        <p th:text="${a_propos?.valeur}"></p>
        <img th:if="${a_propos?.generalInfo?.icone}" th:src="@{${a_propos.generalInfo.icone}}" alt="Icône" width="50">
    </section>

    <section>
        <h3 th:text="${dgi?.titre}"></h3>
        <p th:text="${dgi?.valeur}"></p>
        <img th:if="${dgi?.generalInfo?.icone}" th:src="@{${dgi.generalInfo.icone}}" alt="Icône" width="50">
    </section>

    <section>
        <h3 th:text="${mot_du_dgi?.titre}"></h3>
        <p th:text="${mot_du_dgi?.valeur}"></p>
        <img th:if="${mot_du_dgi?.generalInfo?.icone}" th:src="@{${mot_du_dgi.generalInfo.icone}}" alt="Icône" width="50">
    </section>

    <section>
        <h3 th:text="${historique?.titre}"></h3>
        <p th:text="${historique?.valeur}"></p>
        <img th:if="${historique?.generalInfo?.icone}" th:src="@{${historique.generalInfo.icone}}" alt="Icône" width="50">
    </section>

    <section>
        <h3 th:text="${vision?.titre}"></h3>
        <p th:text="${vision?.valeur}"></p>
        <img th:if="${vision?.generalInfo?.icone}" th:src="@{${vision.generalInfo.icone}}" alt="Icône" width="50">
    </section>

    <section>
        <h3 th:text="${attributions?.titre}"></h3>
        <p th:text="${attributions?.valeur}"></p>
        <img th:if="${attributions?.generalInfo?.icone}" th:src="@{${attributions.generalInfo.icone}}" alt="Icône" width="50">
    </section>

    <section>
        <h3 th:text="${legislation?.titre}"></h3>
        <p th:text="${legislation?.valeur}"></p>
        <img th:if="${legislation?.generalInfo?.icone}" th:src="@{${legislation.generalInfo.icone}}" alt="Icône" width="50">
    </section>

    <section>
        <h3 th:text="${ressources?.titre}"></h3>
        <p th:text="${ressources?.valeur}"></p>
        <img th:if="${ressources?.generalInfo?.icone}" th:src="@{${ressources.generalInfo.icone}}" alt="Icône" width="50">
    </section>

    <section>
        <h3 th:text="${analytiques_fiscales?.titre}"></h3>
        <p th:text="${analytiques_fiscales?.valeur}"></p>
        <img th:if="${analytiques_fiscales?.generalInfo?.icone}" th:src="@{${analytiques_fiscales.generalInfo.icone}}" alt="Icône" width="50">
    </section>
</body>
</html>
