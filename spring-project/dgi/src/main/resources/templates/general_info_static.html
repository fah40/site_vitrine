<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Modifier General Info</title>
    <!-- Inclure QuillJS -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <style>
        .ql-editor {
            min-height: 200px;
        }
    </style>
</head>
<body>

<h2>Modifier General Info</h2>

<!-- Formulaire principal -->
<form th:action="@{/admin/general_info_static/update}" method="post" enctype="multipart/form-data">
    
    <!-- Champ caché pour l'ID -->
    <input type="hidden" name="id" th:value="${generalInfo.id}" /><br>

    <input type="hidden" name="cle" th:value="${generalInfo.cle}" />

    <!-- Icône actuelle -->
    <div>
        <label>Icône actuelle:</label>
        <img th:src="${generalInfo.icone}" alt="Icône" />
    </div><br>

    <!-- Upload d'une nouvelle icône -->
    <label>Nouvelle Icône:</label>
    <input type="text" name="icone"/>

    <!-- Lien -->
    <label>Lien:</label>
    <input type="text" name="lien" th:value="${generalInfo.lien}" />

    <h3>Traductions</h3>

    <!-- Boucle sur les langues -->
    <div th:each="langue : ${langues}">
        <h4 th:text="${langue.nom}"></h4>
        
        <!-- Récupération des valeurs existantes -->
        <input type="hidden" th:name="${langue.id} + '.idLangue'" th:value="${langue.id}" />

        <!-- Titre avec QuillJS -->
        <label>Titre:</label>
        <div th:id="'editor-titre-' + ${langue.id}" class="quill-editor" th:utext="${valeurs[langue.id]?.titre}"></div>
        <input type="hidden" th:id="'titre-' + ${langue.id}" th:name="${langue.id} + '.titre'" />

        <!-- Entête avec input simple -->
        <label>Entête:</label>
        <input type="text" th:name="${langue.id} + '.entete'" th:value="${valeurs[langue.id]?.entete}" />

        <!-- Bouton avec input simple -->
        <label>Bouton:</label>
        <input type="text" th:name="${langue.id} + '.bouton'" th:value="${valeurs[langue.id]?.bouton}" />

        <!-- Champ Valeur avec QuillJS -->
        <label>Valeur:</label>
        <div th:id="'editor-valeur-' + ${langue.id}" class="quill-editor" th:utext="${valeurs[langue.id]?.valeur}"></div>
        <input type="hidden" th:id="'valeur-' + ${langue.id}" th:name="${langue.id} + '.valeur'" />
    </div>

    <button type="submit">Enregistrer</button>

</form>

<!-- Scripts QuillJS -->
<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
<script>
    // Initialiser QuillJS pour chaque éditeur
    document.querySelectorAll('.quill-editor').forEach(function(editorDiv) {
        var editorId = editorDiv.id.split('-')[1]; // Récupérer l'ID de l'éditeur
        var quill = new Quill(editorDiv, {
            theme: 'snow'
        });

        // Mettre à jour le champ caché avec le contenu de Quill avant la soumission du formulaire
        var hiddenInput = document.getElementById(editorDiv.id.replace('editor-', ''));
        quill.on('text-change', function() {
            hiddenInput.value = quill.root.innerHTML;
        });

        // Initialiser le contenu de Quill avec la valeur existante
        if (hiddenInput.value) {
            quill.root.innerHTML = hiddenInput.value;
        }
    });

    // Mettre à jour tous les champs cachés avant la soumission du formulaire
    document.querySelector('form').onsubmit = function() {
        document.querySelectorAll('.quill-editor').forEach(function(editorDiv) {
            var editorId = editorDiv.id.split('-')[1];
            var quill = Quill.find(editorDiv);
            var hiddenInput = document.getElementById(editorDiv.id.replace('editor-', ''));
            hiddenInput.value = quill.root.innerHTML;
        });
    };
</script>

</body>
</html>
