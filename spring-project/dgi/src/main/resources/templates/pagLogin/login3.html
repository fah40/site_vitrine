<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Mot de passe</title>
    
    <!-- Icon -->
    <link rel="icon" type="icon" href="/assets/img/logo/LOGO_DGI_OK.png">

    <!-- Montserrat font -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="/assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="/assets/css/bootstrap.css">
    <link rel="stylesheet" href="/assets/icons/css/all.css">
    <link rel="stylesheet" href="/assets/icons/css/all.min.css">
    <link rel="stylesheet" href="/assets/css/style.css">

    <!-- Script -->
    <script src="/js/jquery.min.js"></script>
    <script src="/js/bootstrap.min.js"></script>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-4 col-md-offset-4 mt-5">
                <div class="logo text-center">
                    <img src="/assets/img/logo/LOGO_DGI_OK.png" alt="Logo DGI" style="width: 50%; height:auto;">
                </div>
                <h3 class="text-center">Admin DGI</h3>
                
                <h2>Connexion - Derniere Étape</h2>

                <p class="alert alert-danger" th:if="${error}" th:text="${error}"></p>

                <form action="/auth/authenticate3" method="post">
                    <input type="hidden" name="email" th:value="${email}">
                    
                    <label>Mot de passe :</label>
                    <input class="form-control bot" type="password" name="password" placeholder="password" required><br>
                    <input class="form-control champ btn btn-primary" type="submit" value="Se connecter">
                </form>

            </div>
        </div>
    </div>
</body>
</html>
