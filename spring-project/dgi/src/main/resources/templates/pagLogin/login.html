<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Connexion</title>
    
    <!-- Icon -->
    <link rel="icon" type="icon" href="/assets/img/logo/LOGO_DGI_OK.png">

    <!-- Montserrat font -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="/assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="/assets/css/bootstrap.css">
    <link rel="stylesheet" href="/assets/icons/css/all.css">
    <link rel="stylesheet" href="/assets/icons/css/all.min.css">
    <link rel="stylesheet" href="/assets/css/style.css">

    <!-- Script -->
    <script src="/js/jquery.min.js"></script>
    <script src="/js/bootstrap.min.js"></script>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-4 col-md-offset-4 mt-5">
                <div class="logo text-center">
                    <img src="/assets/img/logo/LOGO_DGI_OK.png" alt="Logo DGI" style="width: 50%; height:auto;">
                </div>
                <h3 class="text-center">Admin DGI</h3>
                
                <form action="/auth/login" method="POST">
                    <input class="form-control bot" type="email" name="email" placeholder="Email" required><br>
                    
                    <!-- hCaptcha -->
                    <div class="h-captcha" data-sitekey="6ab0bd14-6612-46da-a266-52306aecf550"></div><br>
                    
                    <input class="form-control champ btn btn-primary" type="submit" value="Se connecter">
                </form>
                
                <!-- Messages d'erreur -->
                <p th:if="${error}" th:text="${error}" style="color: red;"></p>
                <p th:if="${param.error}" th:text="${param.error}" style="color: red;"></p>
                <div th:if="${param.minute != null and param.seconds != null}">
                    <p>Réessayez dans <span id="countdown" th:text="${param.minute + ' min ' + param.seconds + ' sec'}"></span></p>
                </div>
            </div>
        </div>
    </div>
    
    <script th:if="${param.minute != null and param.seconds != null}">
        let minutes = parseInt([[${param.minute}]]);
        let seconds = parseInt([[${param.seconds}]]);
        
        function updateCountdown() {
            if (seconds === 0) {
                if (minutes > 0) {
                    minutes--;
                    seconds = 59;
                }
            } else {
                seconds--;
            }
            
            document.getElementById('countdown').innerText = minutes + " min " + seconds + " sec";
            
            if (minutes > 0 || seconds > 0) {
                setTimeout(updateCountdown, 1000);
            }

            if (minutes === 0 && seconds === 0) {
                window.location.href = "/auth/login";
            }
        }
        
        setTimeout(updateCountdown, 1000);
    </script>
    
    <script src="/api.js" async defer></script>
</body>
</html>
