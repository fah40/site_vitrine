<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accueil</title>
</head>
<body>
    <h2>Bienvenue sur votre espace</h2>
    <p>Connexion réussie !</p>

    <!-- Sélection de la langue -->
    <label for="langue">Choisir une langue :</label>
    <select id="langue" onchange="window.location.href='accueil?langue=' + this.value">
        <option th:each="langue : ${langues}" 
                th:value="${langue.id}"
                th:selected="${langue.id == langueSelectionnee}"
                th:text="${langue.nom}">
        </option>
    </select>

    <!-- Affichage des sections de l'accueil avec icônes et boutons de modification -->
    <section>
        <h3 th:text="${a_propos?.titre}"></h3>
        <p th:text="${a_propos?.valeur}"></p>
        <img th:if="${a_propos?.generalInfo?.icone}" th:src="@{${a_propos.generalInfo.icone}}" alt="Icône" width="50">
        <button>
            <a th:href="@{/general_info_static/{cle}(cle='a_propos')}">Modifier</a>
        </button>
    </section>

    <section>
        <h3 th:text="${dgi?.titre}"></h3>
        <p th:text="${dgi?.valeur}"></p>
        <img th:if="${dgi?.generalInfo?.icone}" th:src="@{${dgi.generalInfo.icone}}" alt="Icône" width="50">
        <button>
            <a th:href="@{/general_info_static/{cle}(cle='dgi')}">Modifier</a>
        </button>
    </section>

    <section>
        <h3 th:text="${mot_du_dgi?.titre}"></h3>
        <p th:text="${mot_du_dgi?.valeur}"></p>
        <img th:if="${mot_du_dgi?.generalInfo?.icone}" th:src="@{${mot_du_dgi.generalInfo.icone}}" alt="Icône" width="50">
        <button>
            <a th:href="@{/general_info_static/{cle}(cle='mot_du_dgi')}">Modifier</a>
        </button>
    </section>

    <section>
        <h3 th:text="${legislation?.titre}"></h3>
        <p th:text="${legislation?.valeur}"></p>
        <a th:if="${legislation?.generalInfo?.icone}" 
           th:href="@{/voirfils(id=${legislation.generalInfo.id})}">
            <img th:src="@{${legislation.generalInfo.icone}}" alt="Icône" width="50">
        </a>
        <a th:if="${legislation?.generalInfo?.icone == null}" 
           th:href="@{/voirfils(id=${legislation.generalInfo.id})}">
            <img src="/images/default_icon.png" alt="Icône par défaut" width="50">
        </a>
        <button>
            <a th:href="@{/general_info_static/{cle}(cle='legislation')}">Modifier</a>
        </button>
    </section>
    
    <section>
        <h3 th:text="${ressources?.titre}"></h3>
        <p th:text="${ressources?.valeur}"></p>
        <a th:if="${ressources?.generalInfo?.icone}" 
           th:href="@{/voirfils(id=${ressources.generalInfo.id})}">
            <img th:src="@{${ressources.generalInfo.icone}}" alt="Icône" width="50">
        </a>
        <a th:if="${ressources?.generalInfo?.icone == null}" 
           th:href="@{/voirfils(id=${ressources.generalInfo.id})}">
            <img src="/images/default_icon.png" alt="Icône par défaut" width="50">
        </a>
        <button>
            <a th:href="@{/general_info_static/{cle}(cle='ressources')}">Modifier</a>
        </button>
    </section>
    
    <section>
        <h3 th:text="${analytiques_fiscales?.titre}"></h3>
        <p th:text="${analytiques_fiscales?.valeur}"></p>
        <a th:if="${analytiques_fiscales?.generalInfo?.icone}" 
           th:href="@{/voirfils(id=${analytiques_fiscales.generalInfo.id})}">
            <img th:src="@{${analytiques_fiscales.generalInfo.icone}}" alt="Icône" width="50">
        </a>
        <a th:if="${analytiques_fiscales?.generalInfo?.icone == null}" 
           th:href="@{/voirfils(id=${analytiques_fiscales.generalInfo.id})}">
            <img src="/images/default_icon.png" alt="Icône par défaut" width="50">
        </a>
        <button>
            <a th:href="@{/general_info_static/{cle}(cle='analytiques_fiscales')}">Modifier</a>
        </button>
    </section>
    

</body>
</html>
