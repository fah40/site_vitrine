<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accueil</title>
</head>
<body>
    <h2>Bienvenue sur votre espace</h2>
    <p>Connexion réussie !</p>

    <!-- Sélection de la langue -->
    <label for="langue">Choisir une langue :</label>
    <select id="langue" onchange="window.location.href='accueil?langue=' + this.value">
        <option th:each="langue : ${langues}" 
                th:value="${langue.id}"
                th:selected="${langue.id == langueSelectionnee}"
                th:utext="${langue.nom}">
        </option>
    </select>

        <img th:if="${a_propos?.generalInfo?.icone}" th:src="@{${a_propos.generalInfo.icone}}" alt="Icône" width="50">
        <button>
            <a th:href="@{/admin/general_info_static/{cle}(cle='a_propos')}">Modifier</a>
        </button>
    </section>

     <!-- Affichage des sections de l'accueil avec icônes et boutons de modification -->
